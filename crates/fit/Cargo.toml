[package]
name = "attempt-fit"
description = "Fits the attempt planner's default make-rate curve to OpenPowerlifting results"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
attempt-sim = { path = "../sim" }
csv = "1.4.0"

[dev-dependencies]
rand = { version = "0.10.3", default-features = false }
rand_distr = { version = "0.6.0", default-features = false, features = ["std_math"] }
rand_xoshiro = { version = "0.8.1", default-features = false }
