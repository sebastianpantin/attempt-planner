[workspace]
resolver = "3"
members = ["crates/sim", "crates/sim-wasm", "crates/fit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Sebastian P Liljevall"]
repository = "https://github.com/sebastianpantin/attempt-planner"

# The calibration tests search hard enough to be slow without optimisation.
[profile.dev.package.attempt-fit]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
